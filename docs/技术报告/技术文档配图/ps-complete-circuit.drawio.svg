aHei" font-size="20" font-weight="normal" fill="#20334a">包络与 18 维阶次 → 模型拒识</text><rect x="65" y="510" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="550.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">以太网控制器与网络服务</text><text x="225.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">浏览器双层界面、事件与录音</text><rect x="450" y="510" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="550.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">CPU0 固定目标 GSC 试听</text><text x="610.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">手动方向／DAS 与 GSC 成对音频</text><rect x="835" y="510" width="320" height="100" rx="8" fill="#f0eafa" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="550.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">双核共享内存一致性</text><text x="995.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">SCU／各核缓存、MMU 与屏障</text><rect x="1220" y="510" width="320" height="100" rx="8" fill="#f0eafa" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="550.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">CPU1 独占 DDR 工作区</text><text x="1380.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">频谱、协方差与整窗音频</text><text x="40" y="52" text-anchor="start" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#20334a">PS 整体硬件与软件任务框图</text><text x="45" y="130" text-anchor="start" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#20334a">③ PS 整体框图｜双核 Cortex-A9、DDR 共享数据与网络接口</text><text x="65" y="472" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#20334a">正式定向：诊断复核通过后提交 PL。</text><text x="835" y="472" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#20334a">手动 GSC 方向由网页独立设置。</text><text x="65" y="673" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#20334a">说明：CPU0／CPU1 框内为运行于 PS 的软件职责；DDR、SCU、缓存及接口为硬件资源。</text></svg>