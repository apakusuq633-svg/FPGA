225,490 220.3269798922962,478.94726807196537 229.6730201077038,478.94726807196537" fill="#426581"/><polyline points="1155,205 1185,205 1185,535 1155,535" fill="none" stroke="#426581" stroke-width="2" /><polygon points="1155,535 1166.0527319280345,530.3269798922962 1166.0527319280345,539.6730201077038" fill="#426581"/><polyline points="1380,580 1380,605 225,605 225,580" fill="none" stroke="#ba6a18" stroke-width="2" stroke-dasharray="8 6"/><polygon points="225,580 229.6730201077038,591.0527319280346 220.3269798922962,591.0527319280346" fill="#ba6a18"/><rect x="65" y="160" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="195.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九麦阵列接口</text><text x="225.0" y="223.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">5 根 DATA／公共 PDM_CLK</text><rect x="450" y="160" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="195.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">PDM 接收与抽取</text><text x="610.0" y="223.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">双相采样 → CIC → 九路 PCM</text><rect x="835" y="160" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="195.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">通道预处理与同步分流</text><text x="995.0" y="223.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">去直流、增益校正｜156250 Hz</text><rect x="1220" y="160" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="195.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">时钟、复位与测速</text><text x="1380.0" y="223.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">PL 40 MHz／测速同步滤波</text><rect x="65" y="325" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="360.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">重叠窗口与搬运状态机</text><text x="225.0" y="388.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">1024 点窗／512 点步长</text><rect x="450" y="325" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="360.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">自研五级 RISC-V 声学处理器</text><text x="610.0" y="388.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">共享 FFT/IFFT、四路复数单元</text><rect x="835" y="325" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="360.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">相关环存储与四麦对 SRP</text><text x="995.0" y="388.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">36 麦对 → 1024 格方向评分</text><rect x="1220" y="325" width="320" height="90" rx="8" fill="#eaf2fb" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="360.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">控制与状态寄存器</text><text x="1380.0" y="388.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">定位结果、采集代次、测速状态</text><rect x="65" y="490" width="320" height="90" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">连续 DAS 定向拾音</text><text x="225.0" y="553.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九路延迟补偿与求和</text><rect x="450" y="490" width="320" height="90" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">连续 FIR 与共享 SIMD</text><text x="610.0" y="553.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">32 抽头／八路实数乘加</text><rect x="835" y="490" width="320" height="90" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">采样打包与非阻塞 DMA</text><text x="995.0" y="553.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九路原始 PCM＋DAS/FIR＋状态</text><rect x="1220" y="490" width="320" height="90" rx="8" fill="#fff1df" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九路延迟原子提交</text><text x="1380.0" y="553.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">影子向量 → 同版生效与平滑</text><text x="40" y="52" text-anchor="start" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#20334a">PL 整体电路框图</text><text x="45" y="130" text-anchor="start" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#20334a">① PL 整体电路框图｜同步采集、声学定位与连续拾音</text><text x="65" y="282" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#20334a">公共时钟由 PDM 时钟发生器送往阵列；预处理后的九路 PCM 同时供窗口、DAS 与采样打包。</text><text x="450" y="447" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="normal" fill="#20334a">软核发射声学指令；搬运状态机等待指令退休，再组织频谱、互谱、PHAT、IFFT 和 SRP 数据。</text><text x="65" y="658" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#20334a">PL → PS：DMA 样本流＋寄存器定位结果；PS → PL：参数、恢复和九路延迟提交。</text></svg>