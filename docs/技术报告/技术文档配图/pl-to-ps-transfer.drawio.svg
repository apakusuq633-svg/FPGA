<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660"><rect width="100%" height="100%" fill="white"/><rect x="25" y="90" width="1550" height="500" rx="14" fill="#f4faf8" stroke="#bdcbd9"/><polyline points="385,215.0 450,215.0" fill="none" stroke="#426581" stroke-width="2" /><polygon points="450,215.0 438.94726807196537,219.6730201077038 438.94726807196537,210.3269798922962" fill="#426581"/><polyline points="770,215.0 835,215.0" fill="none" stroke="#426581" stroke-width="2" /><polygon points="835,215.0 823.9472680719654,219.6730201077038 823.9472680719654,210.3269798922962" fill="#426581"/><polyline points="1155,215.0 1220,215.0" fill="none" stroke="#426581" stroke-width="2" /><polygon points="1220,215.0 1208.9472680719655,219.6730201077038 1208.9472680719655,210.3269798922962" fill="#426581"/><polyline points="1380,265 1380,300 995,300 995,350" fill="none" stroke="#426581" stroke-width="2" /><polygon points="995,350 990.3269798922962,338.94726807196537 999.6730201077038,338.94726807196537" fill="#426581"/><polyline points="835,400 770,400" fill="none" stroke="#426581" stroke-width="2" /><polygon points="770,400 781.0527319280346,395.3269798922962 781.0527319280346,404.6730201077038" fill="#426581"/><polyline points="450,400 385,400" fill="none" stroke="#426581" stroke-width="2" /><polygon points="385,400 396.05273192803463,395.3269798922962 396.05273192803463,404.6730201077038" fill="#426581"/><polyline points="610,350 610,315 900,315 900,265" fill="none" stroke="#ba6a18" stroke-width="2" stroke-dasharray="8 6"/><polygon points="900,265 904.6730201077038,276.05273192803463 895.3269798922962,276.05273192803463" fill="#ba6a18"/><rect x="65" y="165" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="205.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">采样打包</text><text x="225.0" y="233.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九路 PCM＋DAS/FIR＋采样身份</text><rect x="450" y="165" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="205.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">内部同步 FIFO</text><text x="610.0" y="233.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">缓冲记录；拥塞时记录丢失</text><rect x="835" y="165" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="205.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">自研非阻塞 DMA</text><text x="995.0" y="233.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">128 字节槽／16 拍 × 64 位</text><rect x="1220" y="165" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="205.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">AXI 互连 → PS HP0</text><text x="1380.0" y="233.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">64 位写入 PS DDR</text><rect x="65" y="350" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="225.0" y="390.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">九路历史缓存</text><text x="225.0" y="418.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">0x0A000000／预留 32 MiB</text><rect x="450" y="350" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="610.0" y="390.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">CPU0 读取与校验</text><text x="610.0" y="418.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">缓存失效、屏障、序号与 CRC</text><rect x="835" y="350" width="320" height="100" rx="8" fill="#e9f5ee" stroke="#7591aa" stroke-width="2"/><text x="995.0" y="390.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">DDR 所有权环</text><text x="995.0" y="418.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">0x08000000／实际环槽 512 KiB</text><rect x="1220" y="350" width="320" height="100" rx="8" fill="#fff1df" stroke="#7591aa" stroke-width="2"/><text x="1380.0" y="376.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">PS GP0 → AXI4-Lite</text><text x="1380.0" y="404.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">主控 0x43C00000</text><text x="1380.0" y="432.0" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#20334a">DMA 0x43C10000</text><text x="40" y="52" text-anchor="start" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#20334a">PL 向 PS 数据传输框图</text><text x="45" y="130" text-anchor="start" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#20334a">② PL → PS 传输框图｜数据写入、所有权交接与控制返回</text><text x="640" y="301" text-anchor="start" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#20334a">消费完成后释放环槽</text><text x="65" y="504" text-anchor="start" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#20334a">写入成功且 AXI 写响应无故障后，DMA 才发布生产位置；CPU0 仅消费已发布槽，再更新消费位置。</text><text x="65" y="543" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#20334a">GP0 控制参数与所有权；HP0 承载采样记录。下游拥塞不暂停 PL 采集，缺口通过计数与采样序号报告。</text><text x="65" y="628" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#20334a">实线：数据／处理结果；橙色虚线：控制／反馈。寄存器窗口各 4 KiB；DMA 区预留 1 MiB。</text></svg>