<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="800" viewBox="0 0 940 800" role="img" aria-labelledby="title description">
  <title id="title">九麦声孔坐标示意：正面视角</title>
  <desc id="description">坐标由当前circular9_array.json生成。CH0至CH7为外围八麦，CH8为中心麦。横向半径22毫米，纵向25.5毫米，斜向23毫米；斜向角45度是建模假设。仅为坐标示意，不是实物照片或加工图，不表示PCB尺寸或实物标定已验收。</desc>
